<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
    <defs>
        <!-- Gradients -->
        <linearGradient id="wosCoreGrad" x1="15" y1="15" x2="105" y2="105" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="45%" stop-color="#818cf8" />
            <stop offset="85%" stop-color="#f72585" />
            <stop offset="100%" stop-color="#ff007f" />
        </linearGradient>

        <linearGradient id="wosRingGrad" x1="20" y1="95" x2="100" y2="25" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9" />
            <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.9" />
        </linearGradient>

        <linearGradient id="wosCloudGrad" x1="30" y1="40" x2="85" y2="85" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
            <stop offset="60%" stop-color="#e0f2fe" stop-opacity="0.85" />
            <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.75" />
        </linearGradient>

        <radialGradient id="wosSunCorona" cx="60" cy="60" r="48" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35" />
            <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
        </radialGradient>

        <!-- Glow filter -->
        <filter id="wosGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="wosAtmosphere" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="6" result="blur" />
        </filter>
    </defs>

    <!-- Ambient Atmospheric Glow -->
    <circle cx="60" cy="60" r="46" fill="url(#wosSunCorona)" filter="url(#wosAtmosphere)" />

    <!-- Planetary / System Orbit Ring (Back Arc) -->
    <ellipse cx="60" cy="60" rx="48" ry="19" transform="rotate(-28 60 60)" 
             stroke="url(#wosRingGrad)" stroke-width="2.5" stroke-dasharray="8 6 18 6" 
             stroke-linecap="round" opacity="0.45" />

    <!-- Celestial Inner Hexagonal / Circular Shield -->
    <circle cx="60" cy="60" r="34" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />

    <!-- Stylized WeatherOS Core: Isometric Isobar Cyclone Vortex forming 'W' & 'O' -->
    <!-- Wave / Cyclone 1: Upper Atmospheric Jetstream -->
    <path d="M 32 62 C 32 46, 45 34, 60 34 C 74 34, 86 44, 88 58 C 89 66, 84 74, 76 77 C 69 80, 60 78, 56 72 C 52 66, 54 59, 61 56 C 67 53, 73 57, 74 62" 
          fill="none" stroke="url(#wosCoreGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#wosGlow)" />

    <!-- Wave / Cyclone 2: Dynamic Lower Isobar Wave -->
    <path d="M 88 58 C 88 74, 75 86, 60 86 C 46 86, 34 76, 32 62 C 31 54, 36 46, 44 43 C 51 40, 60 42, 64 48" 
          fill="none" stroke="url(#wosCoreGrad)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Stylized Atmospheric Cloud / Nimbus Crest in Center -->
    <path d="M 44 64 C 44 59, 48 55, 53 55 C 54.5 50.5, 58.8 47, 64 47 C 70.2 47, 75.3 51.6, 76 57.5 C 79.5 58, 82 61, 82 64.5 C 82 68.5, 78.8 71.5, 74.5 71.5 L 49.5 71.5 C 46.5 71.5, 44 68.2, 44 64 Z" 
          fill="url(#wosCloudGrad)" filter="url(#wosGlow)" opacity="0.9" />

    <!-- Planetary / System Orbit Ring (Front Arc) with Satellite / Node -->
    <path d="M 17 48 C 30 76, 85 86, 103 72" 
          fill="none" stroke="url(#wosRingGrad)" stroke-width="3.2" stroke-linecap="round" />

    <!-- Orbit Node / Sensor Starlight (The 'OS' Connection) -->
    <circle cx="102" cy="71" r="4" fill="#38bdf8" filter="url(#wosGlow)" />
    <circle cx="102" cy="71" r="2" fill="#ffffff" />

    <circle cx="28" cy="42" r="2.5" fill="#f72585" filter="url(#wosGlow)" />
    <circle cx="28" cy="42" r="1.2" fill="#ffffff" />
</svg>