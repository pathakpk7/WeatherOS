<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100" fill="none">
    <defs>
        <linearGradient id="fullWosCore" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="50%" stop-color="#818cf8" />
            <stop offset="100%" stop-color="#f72585" />
        </linearGradient>

        <linearGradient id="fullWosText" x1="110" y1="20" x2="350" y2="80" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="60%" stop-color="#e0e7ff" />
            <stop offset="100%" stop-color="#38bdf8" />
        </linearGradient>

        <linearGradient id="fullWosRing" x1="15" y1="80" x2="85" y2="20" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#00f0ff" />
            <stop offset="60%" stop-color="#a855f7" />
            <stop offset="100%" stop-color="#fbbf24" />
        </linearGradient>

        <linearGradient id="fullWosCloud" x1="25" y1="35" x2="70" y2="70" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="70%" stop-color="#bae6fd" />
            <stop offset="100%" stop-color="#7dd3fc" />
        </linearGradient>

        <filter id="fullWosGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Embedded Emblem (Scaled to 76x76, centered at x=50, y=50) -->
    <g transform="translate(10, 10) scale(0.666)">
        <!-- Planetary Orbit Ring (Back Arc) -->
        <ellipse cx="60" cy="60" rx="48" ry="19" transform="rotate(-28 60 60)" 
                 stroke="url(#fullWosRing)" stroke-width="2.5" stroke-dasharray="8 6 18 6" 
                 stroke-linecap="round" opacity="0.45" />

        <circle cx="60" cy="60" r="34" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />

        <!-- WeatherOS Core Vortex -->
        <path d="M 32 62 C 32 46, 45 34, 60 34 C 74 34, 86 44, 88 58 C 89 66, 84 74, 76 77 C 69 80, 60 78, 56 72 C 52 66, 54 59, 61 56 C 67 53, 73 57, 74 62" 
              fill="none" stroke="url(#fullWosCore)" stroke-width="4.5" stroke-linecap="round" filter="url(#fullWosGlow)" />

        <path d="M 88 58 C 88 74, 75 86, 60 86 C 46 86, 34 76, 32 62 C 31 54, 36 46, 44 43 C 51 40, 60 42, 64 48" 
              fill="none" stroke="url(#fullWosCore)" stroke-width="4.5" stroke-linecap="round" />

        <!-- Nimbus Cloud Crest -->
        <path d="M 44 64 C 44 59, 48 55, 53 55 C 54.5 50.5, 58.8 47, 64 47 C 70.2 47, 75.3 51.6, 76 57.5 C 79.5 58, 82 61, 82 64.5 C 82 68.5, 78.8 71.5, 74.5 71.5 L 49.5 71.5 C 46.5 71.5, 44 68.2, 44 64 Z" 
              fill="url(#fullWosCloud)" filter="url(#fullWosGlow)" opacity="0.9" />

        <!-- Planetary Orbit Ring (Front Arc) with Node -->
        <path d="M 17 48 C 30 76, 85 86, 103 72" 
              fill="none" stroke="url(#fullWosRing)" stroke-width="3.2" stroke-linecap="round" />

        <circle cx="102" cy="71" r="4" fill="#38bdf8" filter="url(#fullWosGlow)" />
        <circle cx="102" cy="71" r="2" fill="#ffffff" />
    </g>

    <!-- Typography -->
    <g transform="translate(100, 0)">
        <text x="0" y="58" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="38" letter-spacing="-0.02em" fill="url(#fullWosText)">
            Weather<tspan fill="#38bdf8">OS</tspan>
        </text>

        <!-- Status Dot Pulse -->
        <circle cx="218" cy="46" r="4.5" fill="#10b981" filter="url(#fullWosGlow)" />
        <circle cx="218" cy="46" r="2" fill="#a7f3d0" />

        <!-- Subtitle -->
        <text x="2" y="77" font-family="'Space Grotesk', monospace" font-weight="600" font-size="10" letter-spacing="0.28em" fill="#94a3b8">
            ATMOSPHERIC INTELLIGENCE OS
        </text>
    </g>
</svg>